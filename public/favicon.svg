<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E1B4B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background badge -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Restaurant Storefront -->
  <g filter="url(#shadow)">
    <!-- Awning / Roof Structure -->
    <path d="M12 25 L17.5 15 C18.5 13.5 20.2 12.5 22 12.5 L42 12.5 C43.8 12.5 45.5 13.5 46.5 15 L52 25 Z" fill="url(#roof)" />
    
    <!-- Awning Stripes -->
    <path d="M19 13.5 L17.5 25 H22.5 L24 13.5 Z" fill="#6366F1" opacity="0.9" />
    <path d="M30 12.5 L29.5 25 H34.5 L34 12.5 Z" fill="#6366F1" opacity="0.9" />
    <path d="M40 13.5 L41.5 25 H46.5 L45 13.5 Z" fill="#6366F1" opacity="0.9" />

    <!-- Scalloped Awning Trim -->
    <path d="M12 25 C14 28 17 28 19 25 C21 28 24 28 26 25 C28 28 31 28 33 25 C35 28 38 28 40 25 C42 28 45 28 47 25 C49 28 51 27 52 25" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

    <!-- Store Body -->
    <rect x="16" y="26" width="32" height="24" rx="2" fill="#FFFFFF" />

    <!-- Store Window -->
    <rect x="19" y="31" width="11" height="12" rx="2" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5" />
    <line x1="24.5" y1="31" x2="24.5" y2="43" stroke="#6366F1" stroke-width="1" />
    <line x1="19" y1="37" x2="30" y2="37" stroke="#6366F1" stroke-width="1" />

    <!-- Store Door -->
    <rect x="33" y="31" width="12" height="19" rx="1.5" fill="#4F46E5" />
    <circle cx="36" cy="41" r="1.2" fill="#FFFFFF" />
  </g>

  <!-- Live Connection Indicator -->
  <circle cx="51" cy="13" r="5.5" fill="#25D366" stroke="#FFFFFF" stroke-width="2" />
</svg>